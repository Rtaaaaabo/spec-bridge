# fly.toml app configuration file generated for spec-bridge on 2026-09-28T21:31:14+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'spec-bridge'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  SPEC_BRIDGE_ANALYZE_CONCURRENCY = '1'
  SPEC_BRIDGE_BASE_URL = 'https://spec-bridge.fly.dev'
  SPEC_BRIDGE_PR_BUDGET_USD = '10'

[processes]
  app = 'pnpm --filter @spec-bridge/web start'
  worker = 'pnpm --filter @spec-bridge/webhook worker'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  processes = ['worker']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['app']
